plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.nestling.youtubeplayer'
version = '1.0.0'

android {
  namespace 'com.nestling.youtubeplayer'

  // expo-module-gradle-plugin only skips its publishing configuration when the
  // module explicitly opts out, so a local module still needs publication
  // coordinates. Without these the whole Gradle configuration fails with
  // "'android.defaultConfig.versionName' is not defined".
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Media3 1.11.0 is the current stable release as of August 2026.
  implementation 'androidx.media3:media3-exoplayer:1.11.0'
  implementation 'androidx.media3:media3-exoplayer-dash:1.11.0'
  implementation 'androidx.media3:media3-exoplayer-hls:1.11.0'
  implementation 'androidx.media3:media3-ui:1.11.0'
  implementation 'androidx.media3:media3-ui-leanback:1.11.0'

  // Stream resolution for approved videos. GPLv3: fine for a private family build,
  // but it makes the whole app GPLv3 if it is ever distributed.
  // ponytail: JitPack is declared in the generated android/build.gradle, which
  // `expo prebuild --clean` would regenerate; move it into app.plugin.js if that bites.
  implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'

  testImplementation 'junit:junit:4.13.2'
}
