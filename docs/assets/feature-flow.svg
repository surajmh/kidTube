<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8a8a"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#FF0033"/>
    </marker>
  </defs>

  <rect width="980" height="620" rx="16" fill="#0F0F0F"/>
  <text x="40" y="46" font-size="18" font-weight="700" fill="#F1F1F1">How kidTube works</text>
  <text x="40" y="66" font-size="12" fill="#AAAAAA">Every play attempt passes one gate. Every approval is a parent decision. Nothing else can start a video.</text>

  <!-- column headers -->
  <text x="150" y="106" font-size="11" fill="#AAAAAA" text-anchor="middle" letter-spacing="1">CHILD &#183; KID MODE</text>
  <text x="490" y="106" font-size="11" fill="#AAAAAA" text-anchor="middle" letter-spacing="1">POLICY &#183; SINGLE DECISION</text>
  <text x="820" y="106" font-size="11" fill="#AAAAAA" text-anchor="middle" letter-spacing="1">PLAYBACK &#183; ANDROID NATIVE</text>

  <!-- Kid library -->
  <rect x="50" y="124" width="200" height="72" rx="10" fill="#212121" stroke="#303030"/>
  <text x="150" y="152" font-size="13" font-weight="600" fill="#F1F1F1" text-anchor="middle">Curated library</text>
  <text x="150" y="172" font-size="11" fill="#AAAAAA" text-anchor="middle">approved videos, channels,</text>
  <text x="150" y="187" font-size="11" fill="#AAAAAA" text-anchor="middle">categories &#183; no search, no feed</text>

  <line x1="150" y1="196" x2="150" y2="232" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- tap play -->
  <rect x="50" y="236" width="200" height="52" rx="10" fill="#212121" stroke="#303030"/>
  <text x="150" y="258" font-size="13" font-weight="600" fill="#F1F1F1" text-anchor="middle">Child taps play</text>
  <text x="150" y="276" font-size="11" fill="#AAAAAA" text-anchor="middle">only allowed rows are visible</text>

  <line x1="250" y1="262" x2="368" y2="262" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- decision diamond -->
  <polygon points="490,176 632,262 490,348 348,262" fill="#1a1a24" stroke="#FF0033" stroke-width="1.6"/>
  <text x="490" y="218" font-size="12.5" font-weight="700" fill="#F1F1F1" text-anchor="middle">PlaybackPolicy.canPlay()</text>
  <g font-size="10.5" fill="#AAAAAA" text-anchor="middle">
    <text x="490" y="240">1 &#183; profile valid</text>
    <text x="490" y="256">2 &#183; approval or grant</text>
    <text x="490" y="272">once &#183; today &#183; 7 days &#183; permanent &#183; channel</text>
    <text x="490" y="288">3 &#183; blocks &#183; 4 &#183; categories</text>
    <text x="490" y="304">5 &#183; hours &#183; bedtime</text>
    <text x="490" y="320">6 &#183; screen time</text>
  </g>

  <!-- deny branch -->
  <line x1="490" y1="348" x2="490" y2="386" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="380" y="390" width="220" height="48" rx="10" fill="#212121" stroke="#303030"/>
  <text x="490" y="411" font-size="12" fill="#F1F1F1" text-anchor="middle">Kid-friendly &#8220;not available&#8221; message</text>
  <text x="490" y="428" font-size="10.5" fill="#AAAAAA" text-anchor="middle">no policy internals leak &#183; Ask a Parent</text>

  <!-- allow branch -->
  <line x1="632" y1="262" x2="718" y2="262" stroke="#5FD068" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="675" y="252" font-size="10.5" fill="#5FD068" text-anchor="middle">allow</text>

  <rect x="722" y="236" width="200" height="52" rx="10" fill="#212121" stroke="#303030"/>
  <text x="822" y="258" font-size="13" font-weight="600" fill="#F1F1F1" text-anchor="middle">PlayerAdapter</text>
  <text x="822" y="276" font-size="11" fill="#AAAAAA" text-anchor="middle">RN controls &#183; video id only</text>

  <line x1="822" y1="288" x2="822" y2="318" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="722" y="322" width="200" height="66" rx="10" fill="#212121" stroke="#303030"/>
  <text x="822" y="344" font-size="12.5" font-weight="600" fill="#F1F1F1" text-anchor="middle">NewPipe extractor</text>
  <text x="822" y="361" font-size="11" fill="#AAAAAA" text-anchor="middle">keyless, on-device</text>
  <text x="822" y="376" font-size="11" fill="#AAAAAA" text-anchor="middle">adaptive HLS ladder</text>

  <line x1="822" y1="388" x2="822" y2="418" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="722" y="422" width="200" height="52" rx="10" fill="#212121" stroke="#303030"/>
  <text x="822" y="444" font-size="12.5" font-weight="600" fill="#F1F1F1" text-anchor="middle">Media3 / ExoPlayer</text>
  <text x="822" y="462" font-size="11" fill="#AAAAAA" text-anchor="middle">D-pad &#183; phone, tablet, Android TV</text>

  <!-- feedback loop from playback to policy -->
  <path d="M722 448 H 300 V 460" fill="none" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4 4"/>
  <rect x="60" y="462" width="380" height="46" rx="10" fill="#1b1b1b" stroke="#303030"/>
  <text x="250" y="482" font-size="11.5" fill="#F1F1F1" text-anchor="middle">Progress ticks &#8594; watch history &#183; screen-time accounting</text>
  <text x="250" y="498" font-size="10.5" fill="#AAAAAA" text-anchor="middle">SponsorBlock segment skips &#183; &#8220;once&#8221; approvals consumed on end</text>

  <!-- parent loop -->
  <rect x="60" y="528" width="862" height="66" rx="12" fill="#181818" stroke="#303030"/>
  <text x="80" y="553" font-size="12" font-weight="700" fill="#F1F1F1">Parent loop</text>
  <g font-size="11" fill="#AAAAAA">
    <text x="80" y="574">Child asks &#8594; parent unlocks PIN session &#8594; approves once / today / 7 days / permanent / whole channel</text>
    <text x="80" y="590">Per-child rules, categories, limits &amp; bedtime &#183; parent overrides grant bounded extra time</text>
  </g>
  <path d="M60 561 H 32 V 310 H 412" fill="none" stroke="#FF0033" stroke-width="1.6" marker-end="url(#arrRed)"/>
  <text x="228" y="300" font-size="10.5" fill="#FF0033" text-anchor="middle">approvals feed the gate</text>
</svg>
