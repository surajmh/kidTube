<svg xmlns="http://www.w3.org/2000/svg" width="340" height="700" viewBox="0 0 340 700" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <clipPath id="screen"><rect x="18" y="18" width="304" height="664" rx="30"/></clipPath>
    <linearGradient id="th1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3f66"/><stop offset="1" stop-color="#1b2338"/></linearGradient>
    <linearGradient id="th2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a3550"/><stop offset="1" stop-color="#251a2b"/></linearGradient>
    <linearGradient id="th3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f4a40"/><stop offset="1" stop-color="#12292a"/></linearGradient>
  </defs>

  <!-- phone frame -->
  <rect x="6" y="6" width="328" height="688" rx="42" fill="#1c1c1e"/>
  <rect x="12" y="12" width="316" height="676" rx="36" fill="#000"/>

  <g clip-path="url(#screen)">
    <rect x="18" y="18" width="304" height="664" fill="#0F0F0F"/>

    <!-- status bar -->
    <text x="38" y="44" font-size="11" fill="#F1F1F1">9:41</text>
    <rect x="268" y="36" width="18" height="9" rx="2" fill="none" stroke="#F1F1F1" stroke-width="1"/>
    <rect x="270" y="38" width="12" height="5" rx="1" fill="#F1F1F1"/>

    <!-- top bar: brand + profiles -->
    <g stroke="#FF0033" stroke-width="2.4" stroke-linecap="round" fill="none">
      <line x1="27" y1="58" x2="30" y2="63"/><line x1="41" y1="58" x2="38" y2="63"/>
    </g>
    <circle cx="26.5" cy="57" r="1.8" fill="#FF0033"/><circle cx="41.5" cy="57" r="1.8" fill="#FF0033"/>
    <rect x="22" y="62" width="24" height="19" rx="6" fill="#FF0033"/>
    <rect x="26" y="66" width="16" height="11" rx="4" fill="#fff"/>
    <path d="M30 70.5 q1.2 1.6 2.4 0 M35.6 70.5 q1.2 1.6 2.4 0" stroke="#3a2b2b" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <text x="52" y="75" font-size="16" font-weight="700" fill="#F1F1F1">kidTube</text>
    <circle cx="252" cy="69" r="13" fill="#3D5AFE"/><text x="252" y="73" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">A</text>
    <circle cx="282" cy="69" r="13" fill="#00897B"/><text x="282" y="73" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">M</text>
    <circle cx="306" cy="69" r="13" fill="#272727"/><text x="306" y="73" font-size="11" fill="#F1F1F1" text-anchor="middle">+</text>
    <line x1="18" y1="94" x2="322" y2="94" stroke="#303030"/>

    <!-- active profile chip -->
    <rect x="34" y="106" width="150" height="26" rx="13" fill="#272727"/>
    <circle cx="48" cy="119" r="7" fill="#3D5AFE"/>
    <text x="62" y="123" font-size="11" fill="#F1F1F1">Arjun &#183; 20 min left today</text>

    <!-- video card 1 -->
    <rect x="34" y="146" width="272" height="153" rx="10" fill="url(#th1)"/>
    <polygon points="160,210 160,232 180,221" fill="#fff" opacity="0.85"/>
    <rect x="256" y="276" width="42" height="17" rx="4" fill="rgba(0,0,0,0.8)"/>
    <text x="277" y="288" font-size="10" fill="#F1F1F1" text-anchor="middle">7:24</text>
    <text x="34" y="321" font-size="13" font-weight="600" fill="#F1F1F1">Counting with Farm Animals &#127806;</text>
    <text x="34" y="338" font-size="11" fill="#AAAAAA">Little Learners &#183; 1.2M views</text>

    <!-- video card 2 -->
    <rect x="34" y="354" width="272" height="153" rx="10" fill="url(#th2)"/>
    <polygon points="160,418 160,440 180,429" fill="#fff" opacity="0.85"/>
    <rect x="256" y="484" width="42" height="17" rx="4" fill="rgba(0,0,0,0.8)"/>
    <text x="277" y="496" font-size="10" fill="#F1F1F1" text-anchor="middle">12:05</text>
    <text x="34" y="529" font-size="13" font-weight="600" fill="#F1F1F1">The Water Cycle &#8212; Story Time</text>
    <text x="34" y="546" font-size="11" fill="#AAAAAA">Wonder Clips &#183; 480K views</text>

    <!-- video card 3 (peek) -->
    <rect x="34" y="562" width="272" height="96" rx="10" fill="url(#th3)"/>
    <polygon points="160,600 160,622 180,611" fill="#fff" opacity="0.85"/>

    <!-- bottom tab bar -->
    <rect x="18" y="606" width="304" height="76" fill="#181818"/>
    <line x1="18" y1="606" x2="322" y2="606" stroke="#303030"/>
    <g font-size="9" text-anchor="middle">
      <g fill="#F1F1F1">
        <rect x="40" y="618" width="16" height="12" rx="2" fill="none" stroke="#F1F1F1" stroke-width="1.6"/>
        <polygon points="48,612 56,618 40,618" fill="#F1F1F1"/>
        <text x="48" y="648">Home</text>
      </g>
      <g fill="#AAAAAA">
        <rect x="103" y="613" width="6" height="6" rx="1"/><rect x="113" y="613" width="6" height="6" rx="1"/><rect x="103" y="623" width="6" height="6" rx="1"/><rect x="113" y="623" width="6" height="6" rx="1"/>
        <text x="111" y="648">Categories</text>
      </g>
      <g fill="#AAAAAA">
        <circle cx="171" cy="619" r="6"/><rect x="163" y="626" width="16" height="4" rx="2"/>
        <text x="171" y="648">Channels</text>
      </g>
      <g fill="#AAAAAA">
        <circle cx="228" cy="620" r="7" fill="none" stroke="#AAAAAA" stroke-width="1.6"/>
        <text x="228" y="648">Recent</text>
      </g>
      <g fill="#AAAAAA">
        <rect x="276" y="612" width="16" height="12" rx="3" fill="none" stroke="#AAAAAA" stroke-width="1.6"/>
        <text x="284" y="648">Ask a Parent</text>
      </g>
    </g>
  </g>
</svg>
